<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top">
    <h1>Start Up</h1>
    <div id="money">$0</div>
  </div>

  <div id="rows"></div>

  <div id="bottom">
    <button onclick="showStats()">Stats</button>
    <button onclick="save(); showPopup('Game saved.');">Save</button>
  </div>

  <div id="popup">
    <div id="box">
      <p id="popupText"></p>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

  <!-- TESTING ONLY: delete this block before turning in -->
  <button onclick="state.money += 10000; update();">Add $10,000 (testing)</button>
  <!-- END TESTING ONLY -->

  <script src="game.js"></script>
</body>
</html>
