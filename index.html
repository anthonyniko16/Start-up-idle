<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Up</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top-bar">
    <h1>Start Up</h1>
    <div id="money-display">$0</div>
  </div>

  <div id="task-list">
    <div class="task-row ready" id="task-row">
      <div class="character-box"></div>
      <div class="task-info">
        <div class="task-name">Fix a Bug</div>
        <div class="progress-outer">
          <div class="progress-inner" id="progress-bar"></div>
        </div>
        <div class="task-status" id="task-status">Click to start</div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
