<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Up</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top-bar">
    <h1>Start Up</h1>
    <div id="money-display">$0</div>
    <div id="investor-display">Investors: 0</div>
  </div>

  <!-- The task rows are added here by buildTaskRows() in game.js -->
  <div id="task-list"></div>

  <div id="bottom-bar">
    <button onclick="clickSave()">Save</button>
    <button onclick="resetGame()">Reset</button>
  </div>

  <div id="message"></div>

  <!-- ===== TESTING ONLY: delete this whole block before turning in ===== -->
  <div id="test-area">
    <button onclick="gameState.money = gameState.money + 10000; updateScreen();">Add $10,000 (testing)</button>
  </div>
  <!-- ===== END OF TESTING ONLY BLOCK ===== -->

  <script src="tasks.js"></script>
  <script src="save.js"></script>
  <script src="game.js"></script>
</body>
</html>
