<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Up</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Only shown if a script file is missing (see checkFilesLoaded() in game.js) -->
  <div id="error-box"></div>

  <div id="top-bar">
    <h1>Start Up</h1>
    <div id="money-display">$0</div>
    <div id="investor-display">Investors: 0</div>
  </div>

  <!-- The task rows are added here by buildTaskRows() in game.js -->
  <div id="task-list"></div>

  <div id="bottom-bar">
    <button onclick="showStats()">Stats</button>
    <button onclick="showAchievements()">Achievements</button>
    <button onclick="clickSave()">Save</button>
    <button onclick="resetGame()">Reset</button>
  </div>

  <!-- Short messages like "Game saved" are added here by showMessage() -->
  <div id="message-area"></div>

  <!-- Popup shown when the player comes back and their team earned money -->
  <div id="welcome-popup" class="popup">
    <div class="popup-box">
      <h2>Welcome back!</h2>
      <p id="welcome-text"></p>
      <button onclick="closeWelcomeBack()">OK</button>
    </div>
  </div>

  <!-- Popup used for both Stats and Achievements -->
  <div id="panel-popup" class="popup">
    <div class="popup-box">
      <h2 id="panel-title"></h2>
      <div id="panel-content"></div>
      <button onclick="closePanel()">Close</button>
    </div>
  </div>

  <!-- ===== TESTING ONLY: delete this whole block before turning in ===== -->
  <div id="test-area">
    <button onclick="gameState.money = gameState.money + 10000; updateScreen();">Add $10,000 (testing)</button>
  </div>
  <!-- ===== END OF TESTING ONLY BLOCK ===== -->

  <script src="tasks.js"></script>
  <script src="sprites.js"></script>
  <script src="save.js"></script>
  <script src="game.js"></script>
</body>
</html>
